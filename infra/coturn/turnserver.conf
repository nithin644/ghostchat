# coturn configuration for GhostChat.
#
# Credentials are NOT static. The API mints a username of the form
# "<expiry-unix-ts>:<pseudo-id>" and an HMAC-SHA1 password over it, using the
# shared secret below. coturn recomputes the HMAC to validate, so no user
# database is needed and every credential expires on its own.
#
# Generate the secret with:  openssl rand -hex 32
# and put the SAME value in TURN_SHARED_SECRET for the API.

listening-port=3478
tls-listening-port=5349

# Behind NAT / a cloud VM you must set the public address explicitly, otherwise
# candidates point at an unroutable private IP and calls fail after ICE.
# external-ip=203.0.113.10

listening-ip=0.0.0.0
relay-ip=0.0.0.0

# UDP relay range. Must match the firewall rules and MEDIASOUP port range
# planning in the deployment docs.
min-port=49160
max-port=49200

# Time-limited credential mechanism (RFC 8489 shared secret).
use-auth-secret
static-auth-secret=CHANGE_ME_coturn_static_auth_secret
realm=ghostchat.invalid

# Hardening
fingerprint
no-multicast-peers
no-cli
no-tcp-relay
stale-nonce=600

# Only relay to the public internet, not back into private ranges. This stops
# the TURN server being used to reach internal services (SSRF-by-proxy).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas: keep one abusive client from consuming the whole relay pool.
user-quota=12
total-quota=1200
max-bps=3000000

log-file=stdout
simple-log
no-software-attribute
