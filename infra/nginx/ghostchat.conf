# Reference clearnet TLS front end (NOT used by run.sh; that script goes
# straight from Tor to the Node proxy).
#
# This file exists for a public HTTPS deployment where you want
# HSTS, OCSP stapling and HTTP/2 — none of which apply to an onion service,
# where Tor provides the transport security and certificates are impossible.
server {
    listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_stapling on;

    # Content that must never be framed or sniffed.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # No request logging: an access log is a metadata record of who talked to
    # whom and when, which is precisely what this system is built to avoid.
    access_log off;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}
